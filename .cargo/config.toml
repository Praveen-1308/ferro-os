# FerroOS Compiler & Linker Hardening Configuration
# Enforces checksec enterprise compliance: Full RELRO, Stack Canary, NX, and PIE.

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))']
rustflags = [
    "-C", "link-arg=-Wl,-z,relro,-z,now",      # Full RELRO (Protects GOT from overwrite)
    "-C", "link-arg=-Wl,-z,noexecstack",     # NX Stack (Prevents executable stack)
    "-C", "relocation-model=pic",            # PIE (Position Independent Executable for ASLR)
]

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))']
rustflags = [
    "-C", "link-arg=-Wl,-z,relro,-z,now",
    "-C", "link-arg=-Wl,-z,noexecstack",
    "-C", "relocation-model=pic",
]
