# tools/stack/nginx.conf
# Production L7 Ingress Configuration with Connection Pooling & Circuit Breaking
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    # Rate Limiting & Leaky Bucket
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5000r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    upstream candidate_backend {
        server candidate-app:3000 max_fails=3 fail_timeout=5s;
        keepalive 64; # Long-lived upstream connection pool
    }

    server {
        listen 10000;
        server_name _;

        location / {
            limit_req zone=api_limit burst=200 nodelay;
            limit_conn conn_limit 512;

            proxy_pass http://candidate_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503;
        }

        location /healthz {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
