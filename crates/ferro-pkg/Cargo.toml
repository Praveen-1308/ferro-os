[package]
name = "ferro-pkg"
version = "2.3.0"
edition = "2021"
authors = ["Praveen Kumar Gorle"]
description = "Fast, lightweight package manager in Rust for FerroOS (rpk)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
tar = "0.4"
libc = "0.2"
