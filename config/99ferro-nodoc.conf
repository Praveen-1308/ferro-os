# FerroOS Lean Package Policy
# Prevents installation of non-essential documentation, man pages, and extraneous locales
# Preserving the ultra-compact base rootfs footprint (~66 MB)

APT::Install-Recommends "0";
APT::Install-Suggests "0";
Dir::Bin::methods::gzip "/bin/gzip";

DPkg::Post-Invoke {
    "rm -rf /usr/share/doc/* /usr/share/man/* /usr/share/groff/* /usr/share/info/* /usr/share/locale/* || true";
};
