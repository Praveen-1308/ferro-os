[package]
name = "ferro-kernel"
version = "0.1.0"
edition = "2021"
authors = ["Praveen Kumar <praveen@ferro-os.org>", "FerroOS Systems Contributors"]
description = "FerroOS bare-metal #![no_std] x86_64 microkernel (Track 2)"
readme = "README.md"
license = "MIT OR Apache-2.0"

[workspace]


[dependencies]
x86_64 = "0.15"
spin = "0.9"
volatile = "0.4"
uart_16550 = "0.3"
pic8259 = "0.11"
pc-keyboard = "0.7"
linked_list_allocator = "0.10"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
