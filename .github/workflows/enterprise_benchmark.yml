name: Enterprise Benchmark Pipeline (RHEL 9 vs Ubuntu 24.04 vs Debian 12 vs FerroOS)

on:
  workflow_dispatch:
    inputs:
      vus:
        description: 'Target Virtual Users for CIS Golden Workload'
        required: false
        default: '100'
      fio_runtime:
        description: 'FIO Benchmark Runtime (seconds)'
        required: false
        default: '10'

jobs:
  enterprise-qualification:
    name: Enterprise Cloud Benchmarking & LTP Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      valkey:
        image: valkey/valkey:8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5

      postgres17:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: enterprise_db
          POSTGRES_USER: ferro_admin
          POSTGRES_PASSWORD: enterprise_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ferro_admin -d enterprise_db"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tune Host Kernel & Limits
        run: |
          sudo prlimit --pid $$ --nofile=1048576:1048576 || true
          ulimit -n 1048576 || ulimit -n 65535 || true
          sudo sysctl -w fs.file-max=2097152 || true
          sudo sysctl -w net.netfilter.nf_conntrack_max=1048576 || true
          sudo sysctl -w net.core.somaxconn=65535 || true

      - name: Install Host Tools (k6, fio, sysbench, rt-tests, zstd)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fio sysbench rt-tests gcc make curl zstd

          # Install Grafana k6
          sudo gpg -k || true
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69 || true
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq k6 || sudo snap install k6 || true

      - name: Build & Cache Enterprise Container Images
        run: |
          echo "[1/4] Building FerroOS Server container..."
          docker build -t ferro-os-server:latest -f Dockerfile.server .
          docker build -t ferro-os-enterprise:latest -f tools/enterprise_qualification/Dockerfile.ferro .

          echo "[2/4] Building Ubuntu 24.04 Enterprise container..."
          docker build -t ubuntu-enterprise:latest -f tools/enterprise_qualification/Dockerfile.ubuntu .

          echo "[3/4] Building Debian 12 Enterprise container..."
          docker build -t debian-enterprise:latest -f tools/enterprise_qualification/Dockerfile.debian .

          echo "[4/4] Building Rocky Linux 9 (RHEL 9) Enterprise container..."
          docker build -t rocky-enterprise:latest -f tools/enterprise_qualification/Dockerfile.rocky .

      - name: Execute Enterprise Benchmark Pipeline
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 tools/enterprise_pipeline/run_enterprise_pipeline.py

      - name: Publish Comparison Scorecard to GitHub Step Summary
        if: always()
        run: |
          for f in reports/runs/*/comparison_summary.md; do
            if [ -f "$f" ]; then
              cat "$f" >> $GITHUB_STEP_SUMMARY
              break
            fi
          done

      - name: Archive Benchmark Telemetry and Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-run-${{ github.run_id }}
          path: reports/runs/*/
          retention-days: 90
