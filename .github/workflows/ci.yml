name: CI - FerroOS Automated Test & Lint Suite

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Rust Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Formatting (cargo fmt)
        run: cargo fmt --check

      - name: Workspace Check (cargo check)
        run: cargo check --workspace --verbose

      - name: Workspace Unit Tests (cargo test)
        run: cargo test --workspace --verbose

      - name: Workspace Clippy (cargo clippy)
        run: cargo clippy --workspace -- -D warnings

  e2e-empirical-tests:
    name: Empirical E2E Real-World Test Suites
    runs-on: ubuntu-latest
    needs: rust-check
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Release Binaries
        run: |
          cargo build --release --workspace
          echo "$GITHUB_WORKSPACE/target/release" >> $GITHUB_PATH
          sudo cp target/release/ferro-* /usr/local/bin/ || true

      - name: Run 12-Scenario File I/O Matrix Suite
        run: python3 tools/test_e2e_all_file_scenarios.py

      - name: Run 12-Scenario Multi-Arch Package Keeper (rpk) Suite
        run: python3 tools/test_e2e_rpk_multiarch_secure.py

      - name: Run Crash-Only & Zero-Downtime Socket Handover Suite
        run: python3 tools/test_e2e_fdstore_crash_recovery.py

      - name: Run Local Shared-Memory DNS Resolver Suite
        run: python3 tools/test_e2e_dns_cache.py

      - name: Run eBPF & Socket Loopback Bypass 12-Scenario Suite
        run: python3 tools/test_e2e_ebpf_socket_bypass.py

      - name: Run 12-Scenario SchedExt & CPU Scheduler Suite
        run: python3 tools/test_e2e_sched_ext.py

      - name: Run 12-Scenario Steam & Proton Gaming Layer Suite
        run: python3 tools/test_e2e_gaming_layer.py

      - name: Run 12-Scenario Bare-Metal ISO & Btrfs Installer Suite
        run: python3 tools/test_e2e_iso_and_btrfs_installer.py

      - name: Run 12-Scenario Security, Exploit Resilience & Chaos Suite
        run: python3 tools/test_e2e_security_and_chaos.py

      - name: Run Windows PE & MSI Compatibility Suite
        run: python3 tools/test_e2e_windows_compatibility.py

      - name: Verify Real Pure-Rust Microservices & High-Performance HTTP Engine
        run: |
          echo "Starting real pure-Rust server-suite (ports 8080, 8081, 8082)..."
          ferro-core server-suite &
          SRV_PID=$!
          sleep 2
          curl -f -s http://127.0.0.1:8080/api/health | grep -q "HEALTHY"
          curl -f -s http://127.0.0.1:8080/api/status | grep -q "FerroOS"
          curl -f -s "http://127.0.0.1:8081/set?key=cloud&val=github-actions" > /dev/null
          curl -f -s "http://127.0.0.1:8081/get?key=cloud" | grep -q "github-actions"
          curl -f -s http://127.0.0.1:8082/ > /dev/null
          kill $SRV_PID || true

          echo "Starting real pure-Rust static webserver (port 8089)..."
          ferro-core serve 8089 . &
          WEB_PID=$!
          sleep 1
          curl -f -s http://127.0.0.1:8089/Cargo.toml | grep -q "workspace"
          kill $WEB_PID || true
          echo "✅ Real pure-Rust microservices and web server verified cleanly on cloud infrastructure!"

  pure-rust-os-pipeline:
    name: Pure-Rust OS Cloud Runtime & Security Standards
    runs-on: ubuntu-latest
    needs: rust-check
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Release Binaries & Pure-Rust cdylib
        run: |
          cargo build --release --workspace
          echo "$GITHUB_WORKSPACE/target/release" >> $GITHUB_PATH
          sudo cp target/release/ferro-core /usr/local/bin/ || true
          sudo cp target/release/ferro-init /usr/local/sbin/ || true
          sudo cp target/release/ferro-pkg /usr/local/bin/ || true
          sudo cp target/release/ferro-superd /usr/local/bin/ || true
          sudo cp target/release/ferrocage /usr/local/bin/ || true
          sudo cp target/release/libferro_io.so /usr/lib/libferro_io.so || true

      - name: Run Pure-Rust Execution Principles Suite
        run: python3 tools/test_rust_os_execution_principles.py

      - name: Run Cloud FHS 3.0 & Sticky-Bit Security Standards
        run: python3 tools/test_pure_rust_os_standards.py

      - name: Run Differential Parity Engine (30/30 GNU Coreutils Parity)
        run: python3 tools/differential_parity_engine.py

      - name: Run Selectable Sandbox Profiles & Multi-Sandbox Shared Memory Mesh
        run: python3 tools/test_sandbox_profiles_and_mesh.py

      - name: Run Next-Gen Service Supervisor (ferro-superd) & Container Runtime (ferrocage)
        run: sudo env "PATH=$PATH" python3 tools/test_supervisor_and_container.py

      - name: Run 9-Scenario Negative Chaos & Adversarial Threat Suite
        run: sudo env "PATH=$PATH" python3 tools/test_negative_scenarios_and_chaos.py

      - name: Run Comprehensive Vulnerability Audit Suite
        run: python3 tools/test_vulnerability_audit.py

      - name: Run Theoretical & Empirical Architecture Benchmark
        run: python3 tools/test_theoretical_architecture_empirical.py

      - name: Verify Python Language Runtime & rpk Package Management
        run: python3 tools/test_ferro_os_python_runtime.py

      - name: Run Full Codebase Survey & Architectural Graph Validator
        run: python3 tools/survey_full_ferro_os.py

      - name: Build All 5 Pure-Rust Appliances (Cloud, Desktop, Gaming, Enterprise, Universal)
        run: python3 tools/build_pure_rust_os.py --edition all

      - name: Verify Multi-Edition Appliance Container Executions
        run: |
          echo "Testing real command execution across all 5 appliances on cloud runner:"
          docker run --rm ferro-os-cloud:latest /usr/bin/cat /etc/os-release | grep -q "FERRO_EDITION=\"cloud\""
          docker run --rm ferro-os-desktop:latest /usr/bin/cat /etc/os-release | grep -q "FERRO_EDITION=\"desktop\""
          docker run --rm ferro-os-gaming:latest /usr/bin/cat /etc/os-release | grep -q "FERRO_EDITION=\"gaming\""
          docker run --rm ferro-os-enterprise:latest /usr/bin/cat /etc/os-release | grep -q "FERRO_EDITION=\"enterprise\""
          docker run --rm ferro-os-pure:latest /usr/bin/cat /etc/os-release | grep -q "FERRO_EDITION=\"pure\""
          
          docker run --rm ferro-os-pure:latest /usr/bin/ferro-core whoami
          docker run --rm ferro-os-pure:latest /usr/bin/ferro-core id
          docker run --rm ferro-os-pure:latest /usr/bin/ferro-core uname -a
          docker run --rm ferro-os-pure:latest /usr/bin/ferro-core ps
          docker run --rm ferro-os-pure:latest /usr/bin/ferro-core free
          docker run --rm ferro-os-pure:latest /usr/bin/ferro-core df -h
          docker run --rm ferro-os-pure:latest /usr/bin/ferro-core dhcp --dry-run -t 1
          docker run --rm ferro-os-pure:latest /usr/bin/sh -c "echo 'Real Cloud Container OS Execution Verified' && whoami && id && pwd"
          docker run --rm ferro-os-pure:latest /usr/bin/hackbench -g 2 -l 20 -s 64
          docker run --rm ferro-os-pure:latest /usr/bin/bench-fsync -n 4 -s 128
          echo "✅ FerroOS pure-Rust OS appliances successfully executed on cloud Linux kernel!"

  bare-metal-os-qemu-boot:
    name: Bare-Metal Real OS Boot & Hardware QEMU Suite
    runs-on: ubuntu-latest
    needs: rust-check
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install QEMU & System Virtualization Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 cpio isolinux syslinux-utils xorriso

      - name: Compile Release Binaries & Pure-Rust cdylib
        run: |
          cargo build --release -p ferro-init -p ferro-core -p ferro-pkg -p ferro-io
          echo "$GITHUB_WORKSPACE/target/release" >> $GITHUB_PATH

      - name: Build Real FerroOS Distribution (Linux Kernel + Rust Initrd)
        run: |
          sudo env "PATH=$PATH" python3 tools/build_real_ferro_os.py
          sudo chmod -R 777 build_out

      - name: Boot Real FerroOS in QEMU Serial Console
        run: python3 tools/test_qemu_real_os.py

      - name: Upload Bootable Bare-Metal FerroOS ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferro-os-bare-metal-live-iso
          path: build_out/ferro-os-live.iso
          if-no-files-found: warn
