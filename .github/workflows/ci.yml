name: CI - FerroOS Automated Test & Lint Suite

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Rust Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Formatting (cargo fmt)
        run: cargo fmt --check

      - name: Workspace Check (cargo check)
        run: cargo check --workspace --verbose

      - name: Workspace Unit Tests (cargo test)
        run: cargo test --workspace --verbose

      - name: Workspace Clippy (cargo clippy)
        run: cargo clippy --workspace -- -W clippy::all

  e2e-empirical-tests:
    name: Empirical E2E Real-World Test Suites
    runs-on: ubuntu-latest
    needs: rust-check
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Release Binaries
        run: |
          cargo build --release --workspace
          echo "$GITHUB_WORKSPACE/target/release" >> $GITHUB_PATH
          sudo cp target/release/ferro-* /usr/local/bin/ || true

      - name: Run 12-Scenario File I/O Matrix Suite
        run: python3 tools/test_e2e_all_file_scenarios.py

      - name: Run 12-Scenario Multi-Arch Package Keeper (rpk) Suite
        run: python3 tools/test_e2e_rpk_multiarch_secure.py

      - name: Run Crash-Only & Zero-Downtime Socket Handover Suite
        run: python3 tools/test_e2e_fdstore_crash_recovery.py

      - name: Run Local Shared-Memory DNS Resolver Suite
        run: python3 tools/test_e2e_dns_cache.py

      - name: Run eBPF & Socket Loopback Bypass 12-Scenario Suite
        run: python3 tools/test_e2e_ebpf_socket_bypass.py

      - name: Run 12-Scenario SchedExt & CPU Scheduler Suite
        run: python3 tools/test_e2e_sched_ext.py

      - name: Run 12-Scenario Steam & Proton Gaming Layer Suite
        run: python3 tools/test_e2e_gaming_layer.py

      - name: Run 12-Scenario Bare-Metal ISO & Btrfs Installer Suite
        run: python3 tools/test_e2e_iso_and_btrfs_installer.py

      - name: Run 12-Scenario Security, Exploit Resilience & Chaos Suite
        run: python3 tools/test_e2e_security_and_chaos.py

      - name: Run Windows PE & MSI Compatibility Suite
        run: python3 tools/test_e2e_windows_compatibility.py

      - name: Run $12 Server Challenge 50-50 Normalized Regression Suite
        run: |
          python3 tools/normalized_server.py &
          SRV_PID=$!
          sleep 2
          curl -f -s http://127.0.0.1:9300/feed > /dev/null
          curl -f -s http://127.0.0.1:9300/metrics > /dev/null
          curl -f -s -X POST http://127.0.0.1:9300/posts/1/like > /dev/null
          kill $SRV_PID || true
          echo "✅ 50-50 Normalized Server verified cleanly in CI!"

  pure-rust-os-pipeline:
    name: Pure-Rust OS Cloud Runtime & Security Standards
    runs-on: ubuntu-latest
    needs: rust-check
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Release Binaries & Pure-Rust cdylib
        run: |
          cargo build --release -p ferro-init -p ferro-core -p ferro-pkg -p ferro-io
          echo "$GITHUB_WORKSPACE/target/release" >> $GITHUB_PATH
          sudo cp target/release/ferro-core /usr/local/bin/ || true
          sudo cp target/release/ferro-init /usr/local/sbin/ || true
          sudo cp target/release/libferro_io.so /usr/lib/libferro_io.so || true

      - name: Run Pure-Rust Execution Principles Suite
        run: python3 tools/test_rust_os_execution_principles.py

      - name: Run Cloud FHS 3.0 & Sticky-Bit Security Standards
        run: python3 tools/test_pure_rust_os_standards.py

      - name: Run Comprehensive Vulnerability Audit Suite
        run: python3 tools/test_vulnerability_audit.py

      - name: Run Theoretical & Empirical Architecture Benchmark
        run: python3 tools/test_theoretical_architecture_empirical.py

      - name: Build Autonomous 2.9MB Pure-Rust RootFS & Scratch Container Image
        run: python3 tools/build_pure_rust_os.py

      - name: Verify Container Execution on Cloud Kernel (ferro-os-pure:latest)
        run: |
          echo "Testing command execution on cloud runner:"
          docker run --rm ferro-os-pure:latest /usr/bin/ferro-core whoami
          docker run --rm ferro-os-pure:latest /usr/bin/ferro-core id
          docker run --rm ferro-os-pure:latest /usr/bin/ferro-core dhcp --test-synthetic
          docker run --rm ferro-os-pure:latest /usr/bin/hackbench -g 2 -l 20 -s 64
          docker run --rm ferro-os-pure:latest /usr/bin/bench-fsync -n 4 -s 128
          echo "✅ FerroOS pure-Rust OS successfully executed in GitHub Actions cloud environment!"
