name: Release - Automated Cross-Architecture Binary Publishing

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag Name (e.g. v1.1.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-release-binaries:
    name: Build & Package ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch_name: x86_64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            arch_name: aarch64
            use_cross: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (for cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Target Binaries
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p ferro-init -p ferro-core -p ferro-pkg
          else
            cargo build --release --target ${{ matrix.target }} -p ferro-init -p ferro-core -p ferro-pkg
          fi

      - name: Assemble & Checksum Release Bundle
        run: |
          RELEASE_DIR="ferro-os-${{ matrix.arch_name }}"
          mkdir -p "$RELEASE_DIR/bin"
          
          TARGET_DIR="target/${{ matrix.target }}/release"
          cp "$TARGET_DIR/ferro-init" "$RELEASE_DIR/bin/"
          cp "$TARGET_DIR/ferro-core" "$RELEASE_DIR/bin/"
          cp "$TARGET_DIR/ferro-pkg"  "$RELEASE_DIR/bin/"
          
          # Strip debug symbols
          strip "$RELEASE_DIR/bin/"* || true
          
          # Add README and License
          cp README.md LICENSE "$RELEASE_DIR/"
          
          # Create compressed tarball
          TARBALL="ferro-os-coreutils-${{ github.ref_name || inputs.tag_name }}-${{ matrix.arch_name }}.tar.gz"
          tar -czvf "$TARBALL" "$RELEASE_DIR"
          
          # Generate SHA256 checksum
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          
          echo "TARBALL_PATH=$TARBALL" >> $GITHUB_ENV
          echo "CHECKSUM_PATH=$TARBALL.sha256" >> $GITHUB_ENV

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch_name }}
          path: |
            ${{ env.TARBALL_PATH }}
            ${{ env.CHECKSUM_PATH }}

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_assets/

      - name: Flatten Artifact Directory
        run: |
          mkdir -p dist
          find release_assets/ -type f -name "*.tar.gz*" -exec cp {} dist/ \;
          ls -la dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: "FerroOS ${{ github.ref_name || inputs.tag_name }} Release"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
