name: Cloud Scenario Intelligence & Discovery Harvester (Cron)

on:
  schedule:
    # Runs daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual Trigger Rationale'
        required: false
        default: 'Ad-hoc cloud server scenario discovery'

concurrency:
  group: scenario-harvester
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harvest-cloud-scenarios:
    name: Harvest & Ingest Cloud Server Failure Scenarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Scenario Discovery Engine
        env:
          # Search & Web Intelligence APIs
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          BING_SEARCH_API_KEY: ${{ secrets.BING_SEARCH_API_KEY }}
          
          # AI Reasoning & Incident Synthesis APIs
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

          # Developer Community & Incident Repositories
          STACKEXCHANGE_API_KEY: ${{ secrets.STACKEXCHANGE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          CENSYS_API_ID: ${{ secrets.CENSYS_API_ID }}
          CENSYS_API_SECRET: ${{ secrets.CENSYS_API_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/scenarios/harvest_scenarios.py

      - name: Publish Discovered Scenarios to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status -s scenarios/ new_scenarios.json) ]]; then
            git add scenarios/ new_scenarios.json
            git commit -m "chore(scenarios): harvest new cloud failure scenarios [skip ci]"
            git push origin main
            echo "### 🌐 Cloud Scenario Harvester Summary" >> $GITHUB_STEP_SUMMARY
            echo "Novel cloud server scenarios were successfully discovered and ingested into \`scenarios/new_scenarios.json\`." >> $GITHUB_STEP_SUMMARY
            echo "All newly discovered failure modes are marked **[QUEUED_FOR_ANALYSIS]**." >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🌐 Cloud Scenario Harvester Summary" >> $GITHUB_STEP_SUMMARY
            echo "Scenario catalog is already completely synchronized. Zero novel duplicates found." >> $GITHUB_STEP_SUMMARY
          fi
