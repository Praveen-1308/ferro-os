name: Build & Verify FerroOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build FerroOS & QEMU Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 python3 python3-minimal cpio gzip

      - name: Rust Workspace Unit & Lint Check
        run: |
          cargo check --workspace --verbose
          cargo test --workspace --verbose

      - name: Build Rootfs & Initramfs
        run: |
          chmod +x build/build-rootfs.sh
          ./build/build-rootfs.sh

      - name: Copy Kernel for Distribution
        run: |
          KERNEL=$(ls -1 /boot/vmlinuz* | head -n1)
          sudo cp "$KERNEL" build_out/vmlinuz
          sudo chmod +r build_out/vmlinuz
          sudo chown $USER:$USER build_out/vmlinuz

      - name: Run QEMU Headless Boot & Python Verification
        run: |
          chmod +x build/qemu-test.sh
          ./build/qemu-test.sh

      - name: Generate Local QEMU Boot Script
        run: |
          cat << 'EOF' > build_out/run-ferro-os.sh
          #!/usr/bin/env bash
          # Launch FerroOS in QEMU with Graphical Desktop
          qemu-system-x86_64 \
            -kernel vmlinuz \
            -initrd initramfs.cpio.gz \
            -append "console=ttyS0 quiet vga=792" \
            -vga std \
            -m 512M
          EOF
          chmod +x build_out/run-ferro-os.sh

      - name: Upload Bootable FerroOS Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferro-os-x86_64
          path: |
            build_out/vmlinuz
            build_out/initramfs.cpio.gz
            build_out/run-ferro-os.sh
            build_out/qemu_boot.log
            docs/screenshot.png
