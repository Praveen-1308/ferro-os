name: Nightly Health & Security Cron

on:
  schedule:
    # Runs at 03:00 UTC every single day (Free cloud cron job)
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  nightly-health-audit:
    name: Nightly Health, Security & Regression Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Cargo Dependencies for Known Vulnerabilities
        run: |
          cargo install cargo-audit || true
          cargo audit || true

      - name: Compile Release Workspace
        run: |
          cargo build --release --workspace
          echo "$GITHUB_WORKSPACE/target/release" >> $GITHUB_PATH
          sudo cp target/release/ferro-* /usr/local/bin/ || true

      - name: Execute Full Suite of 4 Empirical Regression Matrices
        run: |
          echo "### Nightly Test Execution Report" >> $GITHUB_STEP_SUMMARY
          
          echo "Running File I/O 12-scenario matrix..."
          python3 tools/test_e2e_all_file_scenarios.py
          echo "- ✅ File I/O 12-scenario matrix: PASS" >> $GITHUB_STEP_SUMMARY

          echo "Running Multi-Arch Package Keeper (rpk) 12-scenario suite..."
          python3 tools/test_e2e_rpk_multiarch_secure.py
          echo "- ✅ Multi-Arch Package Keeper (rpk) 12-scenario suite: PASS" >> $GITHUB_STEP_SUMMARY

          echo "Running Crash-Only & Zero-Downtime Socket Handover test..."
          python3 tools/test_e2e_fdstore_crash_recovery.py
          echo "- ✅ SCM_RIGHTS FD Store Handover: PASS" >> $GITHUB_STEP_SUMMARY

          echo "Running Local Shared-Memory DNS Resolver benchmark..."
          python3 tools/test_e2e_dns_cache.py
          echo "- ✅ Local Shared-Memory DNS Resolver: PASS" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🏆 FerroOS Nightly Status: 100% HEALTHY" >> $GITHUB_STEP_SUMMARY
