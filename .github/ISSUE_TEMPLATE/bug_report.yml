name: "Bug Report"
description: "File an issue about a problem or regression in FerroOS"
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue in FerroOS!
        Please fill out this form with as much detail as possible.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of FerroOS is experiencing the problem?
      options:
        - "ferro-init (PID 1 Init & Supervisor)"
        - "ferro-core (Core Unix Applets & Shell)"
        - "ferro-pkg / rpk (Package Keeper & Multi-Arch)"
        - "libferro_io.so (I/O Interposition & io_uring)"
        - "KDE Plasma Desktop Edition (noVNC / GUI)"
        - "Server Edition (Docker / Microservices)"
        - "Network / DNS Caching Resolver"
        - "Other"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FerroOS Version / Git Commit
      description: Which version or commit are you running? (e.g. v1.0.0, e156433, or branch main)
      placeholder: "v1.0.0-gold-recovery-point (e156433)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Host Environment
      description: Where are you running FerroOS? (e.g. Bare Metal, QEMU, Docker on macOS Apple Silicon, Linux x86_64)
      placeholder: "Docker on macOS Apple Silicon (aarch64) with --memory=6g"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands executed to reproduce the issue.
      placeholder: |
        1. docker run --rm -it ferro-os-server:latest sh
        2. rpk install ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste terminal output, error messages, or crash backtraces.
      render: shell
