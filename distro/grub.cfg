set timeout=5
set default=0

# Style & Colors
set color_normal=light-gray/black
set color_highlight=black/light-cyan

menuentry "FerroOS 3.0 (Pure-Rust Userspace - Default)" {
    echo "Loading FerroOS Kernel..."
    linux /boot/vmlinuz quiet loglevel=3 panic=10 init=/init
    echo "Loading FerroOS Rust Initramfs (ferro-init + ferro-core)..."
    initrd /boot/initramfs.img
}

menuentry "FerroOS 3.0 (Verbose Debug & Serial Console)" {
    echo "Loading FerroOS Kernel with serial debug output..."
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 ferro.debug=1 panic=10 init=/init
    echo "Loading FerroOS Rust Initramfs..."
    initrd /boot/initramfs.img
}

menuentry "FerroOS 3.0 (Emergency Recovery Mode)" {
    echo "Loading FerroOS in emergency recovery mode..."
    linux /boot/vmlinuz single ferro.mode=recovery panic=10 init=/init
    echo "Loading FerroOS Rust Initramfs..."
    initrd /boot/initramfs.img
}

menuentry "FerroOS Bare-Metal Kernel (Track 2 Multiboot2 / Experimental)" {
    echo "Loading FerroOS Bare-Metal #![no_std] Kernel..."
    multiboot2 /boot/ferro-kernel.bin
}

menuentry "Reboot System" {
    reboot
}

menuentry "Power Off System" {
    halt
}
