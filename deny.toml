# FerroOS Enterprise License & Security Compliance Policy (cargo-deny)
# Enforces strict open-source governance and supply-chain hygiene.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]

# -----------------------------------------------------------------------------
# 1. ADVISORIES (Vulnerability & CVE Management)
# -----------------------------------------------------------------------------
[advisories]
version = 2
vulnerability = "deny"
unmaintained = "warn"
unsound = "warn"
yanked = "deny"
ignore = []

# -----------------------------------------------------------------------------
# 2. LICENSES (Commercial Enterprise Governance)
# -----------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]
deny = [
    "GPL-1.0-only",
    "GPL-1.0-or-later",
    "GPL-2.0-only",
    "GPL-2.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "AGPL-1.0-only",
    "AGPL-1.0-or-later",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "SSPL-1.0",
]

# -----------------------------------------------------------------------------
# 3. BANS (Dependency Trees & Multi-Version Deduplication)
# -----------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
