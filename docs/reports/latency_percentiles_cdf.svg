<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="420" style="background:#070a12; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
<text x="30" y="42" fill="#ffffff" font-size="20" font-weight="800">Cumulative Distribution Function (CDF) Latency Curve</text>
<text x="30" y="64" fill="#94a3b8" font-size="13">Percentile containment from p50 to p99.99 under load | Lower is Better</text>
<line x1="80" y1="340" x2="840" y2="340" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
<line x1="80" y1="100" x2="80" y2="340" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
<line x1="160" y1="100" x2="160" y2="340" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3,3" />
<text x="160" y="360" fill="#64748b" font-size="12" text-anchor="middle">p50</text>
<line x1="300" y1="100" x2="300" y2="340" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3,3" />
<text x="300" y="360" fill="#64748b" font-size="12" text-anchor="middle">p75</text>
<line x1="440" y1="100" x2="440" y2="340" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3,3" />
<text x="440" y="360" fill="#64748b" font-size="12" text-anchor="middle">p90</text>
<line x1="580" y1="100" x2="580" y2="340" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3,3" />
<text x="580" y="360" fill="#64748b" font-size="12" text-anchor="middle">p95</text>
<line x1="720" y1="100" x2="720" y2="340" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3,3" />
<text x="720" y="360" fill="#64748b" font-size="12" text-anchor="middle">p99</text>
<line x1="820" y1="100" x2="820" y2="340" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3,3" />
<text x="820" y="360" fill="#64748b" font-size="12" text-anchor="middle">p99.99</text>
<line x1="75" y1="340" x2="840" y2="340" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3,3" />
<text x="65" y="344" fill="#64748b" font-size="11" text-anchor="end">0ms</text>
<line x1="75" y1="280" x2="840" y2="280" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3,3" />
<text x="65" y="284" fill="#64748b" font-size="11" text-anchor="end">500ms</text>
<line x1="75" y1="220" x2="840" y2="220" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3,3" />
<text x="65" y="224" fill="#64748b" font-size="11" text-anchor="end">1000ms</text>
<line x1="75" y1="160" x2="840" y2="160" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3,3" />
<text x="65" y="164" fill="#64748b" font-size="11" text-anchor="end">1500ms</text>
<line x1="75" y1="100" x2="840" y2="100" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3,3" />
<text x="65" y="104" fill="#64748b" font-size="11" text-anchor="end">2000ms</text>
<path d="M 80 300 Q 300 280, 580 200 T 720 115 T 820 102" fill="none" stroke="#f87171" stroke-width="3" />
<text x="825" y="102" fill="#f87171" font-size="11" font-weight="700">Ubuntu 24.04 (1,875ms)</text>
<path d="M 80 338 Q 400 337, 720 336 T 820 330" fill="none" stroke="#a78bfa" stroke-width="2.5" />
<text x="825" y="328" fill="#a78bfa" font-size="11" font-weight="600">Alpine 3.24 (18.4ms)</text>
<path d="M 80 339 Q 400 339, 720 338 T 820 337" fill="none" stroke="#38bdf8" stroke-width="3" />
<text x="825" y="345" fill="#38bdf8" font-size="11" font-weight="700">FerroOS v2.0 (10.47ms)</text>
<rect x="80" y="380" width="12" height="12" rx="2" fill="#38bdf8" />
<text x="98" y="391" fill="#cbd5e1" font-size="12">FerroOS v2.0 (SO_REUSEPORT Sharded)</text>
<rect x="340" y="380" width="12" height="12" rx="2" fill="#a78bfa" />
<text x="358" y="391" fill="#cbd5e1" font-size="12">Alpine Linux (musl libc)</text>
<rect x="540" y="380" width="12" height="12" rx="2" fill="#f87171" />
<text x="558" y="391" fill="#cbd5e1" font-size="12">Ubuntu 24.04 (glibc / EEVDF single queue)</text>
